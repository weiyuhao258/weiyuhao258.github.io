<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="2080" viewBox="0 0 2600 2080" role="img" aria-labelledby="title desc">
<title id="title">双流时序 Actor–Critic</title>
<desc id="desc">A compact overview and one continuous fusion block. Eleven robot observations comprise ten past frames plus the current frame. Twenty-one Reference Motion frames comprise ten past target frames, the current target frame, and ten future target frames. Fusion Block 1 uses all history queries; Fusion Block 2 uses only the current query while retaining all history and Reference Motion keys and values. Cross queries are projected from the updated self-attention tokens without pooling. Actor and Critic weights are independent.</desc>
<defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3971a9"/></marker>
